name: Cross-platform Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - ".github/workflows/cross-platform-release.yml"

permissions:
  contents: write

jobs:
  linux-x64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libx11-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-linux-x64
      - name: Build
        run: cargo build --release --locked --features gui --bins --target x86_64-unknown-linux-gnu
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          cp target/x86_64-unknown-linux-gnu/release/codex-migrate package/
          cp target/x86_64-unknown-linux-gnu/release/codex-migrate-gui package/
          cp LICENSE package/
          tar -C package -czf Codex-Migrate-Linux-x64.tar.gz .
          sha256sum Codex-Migrate-Linux-x64.tar.gz > Codex-Migrate-Linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            Codex-Migrate-Linux-x64.tar.gz
            Codex-Migrate-Linux-x64.tar.gz.sha256
          if-no-files-found: error

  windows-x64:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows-x64
      - name: Build
        shell: pwsh
        run: cargo build --release --locked --features gui --bins --target x86_64-pc-windows-msvc
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item target\x86_64-pc-windows-msvc\release\codex-migrate-gui.exe "package\Codex Migrate.exe"
          Copy-Item target\x86_64-pc-windows-msvc\release\codex-migrate.exe "package\codex-migrate-cli.exe"
          Copy-Item LICENSE "package\LICENSE.txt"
          Compress-Archive -Path package\* -DestinationPath Codex-Migrate-Windows-x64.zip
          (Get-FileHash Codex-Migrate-Windows-x64.zip -Algorithm SHA256).Hash.ToLower() + "  Codex-Migrate-Windows-x64.zip" |
            Out-File -Encoding ascii Codex-Migrate-Windows-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            Codex-Migrate-Windows-x64.zip
            Codex-Migrate-Windows-x64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish v1.x release
    needs: [linux-x64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          TAG="v${VERSION}"
          TITLE="Codex Migrate v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Fork release built from commit \`$GITHUB_SHA\`. Includes Linux x64 and Windows x64 GUI/CLI builds. See CHANGELOG.md for release changes."
          fi
